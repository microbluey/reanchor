name: Release

# Publishing runs from a tag, never from a laptop, so what is on the registry is
# what is in the repository. Both packages go out together: they share a version
# because a selector described by one must resolve in the other.
#
# Both registries publish via trusted publishing (OIDC), so there are no tokens
# in this repository's secrets.
#
# The two registries bootstrap differently, which matters exactly once. PyPI
# accepts a *pending* publisher for a project that does not exist yet, so its
# first release can come from here. npm's trusted-publisher settings live under
# a package that must already exist, so `reanchor@0.1.0` was published once from
# a laptop to create it; every release after that is this workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
        working-directory: python
      - run: uv run ruff check .
        working-directory: python
      - run: uv run ruff format --check .
        working-directory: python
      - run: uv run mypy
        working-directory: python
      - run: uv run pytest
        working-directory: python

      # A tag that disagrees with the manifests would publish a version nobody
      # can trace back to a commit. Catch it before either registry sees it.
      - name: Versions agree with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(node -p "require('./package.json').version")
          py_version=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag npm=$npm_version python=$py_version"
          test "$tag" = "$npm_version" || { echo "package.json disagrees"; exit 1; }
          test "$tag" = "$py_version" || { echo "pyproject.toml disagrees"; exit 1; }

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1. Node 24's current release
          # ships well past that, so take the line rather than pinning a patch
          # floor -- pinning 22.14 put the runner on npm 10.9 and then made
          # `npm install -g npm@latest` unsatisfiable, since npm 12 requires a
          # newer Node than the pin allowed.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Fail loudly here rather than getting an opaque auth error from publish.
      - name: npm is new enough for trusted publishing
        run: |
          have=$(npm --version)
          echo "npm $have"
          printf '11.5.1\n%s\n' "$have" | sort -C -V || {
            echo "trusted publishing needs npm >= 11.5.1"; exit 1;
          }

      # A release where one registry succeeded and the other failed should be
      # fixable by re-running it, so a version already on the registry is a
      # no-op rather than a failure. This also covers 0.1.0, which npm required
      # to be published manually before it would accept a trusted publisher.
      - name: Publish unless already there
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "reanchor@$version" version >/dev/null 2>&1; then
            echo "reanchor@$version is already on npm; nothing to do."
            exit 0
          fi
          # No --provenance: trusted publishing attaches provenance itself when
          # the repository and package are both public.
          npm publish --access public

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # Same reasoning as the npm job: re-running a partially-failed release
          # should be safe.
          skip-existing: true
